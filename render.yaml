# Render Blueprint — BACKEND ONLY (API + admin dashboard + PostgreSQL via Supabase).
# The React frontend is hosted separately on Vercel.
#
# The database is hosted on Supabase (free tier PostgreSQL), so no persistent
# disk is needed and this can run on Render's free plan.
#
# After the first deploy, copy this service's URL (e.g. https://gunji-api.onrender.com)
# into the Vercel project as VITE_API_URL, and set CORS_ORIGINS here to your
# Vercel URL(s).
services:
  - type: web
    name: gunji-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to Nepal
    branch: main
    buildCommand: npm install
    # seed runs once on first boot (no-ops afterwards), then the server starts
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false            # set as a secret in the dashboard
      - key: DATABASE_URL
        sync: false            # Supabase PostgreSQL connection string
      - key: GOOGLE_CLIENT_ID
        # Public OAuth Client ID (safe to commit — it's exposed in the frontend
        # sign-in button anyway). Enables "Continue with Google" on /account.
        value: "731951011595-jeqd4rsca0fku1n0ter20g06ovp963co.apps.googleusercontent.com"
      - key: CORS_ORIGINS
        sync: false            # e.g. https://gunji.vercel.app (comma-separated)
      - key: TELEGRAM_BOT_TOKEN
        sync: false            # secret — set in dashboard (owner order alerts)
      - key: TELEGRAM_CHAT_ID
        sync: false            # your Telegram chat id — set in dashboard
      - key: TRUST_PROXY
        value: "1"
