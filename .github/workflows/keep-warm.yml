name: keep-warm

# Pings the Render backend so it never spins down (free tier sleeps after ~15
# min idle) and Supabase stays active (the health endpoint queries the DB, so
# this also prevents Supabase's 7-day inactivity auto-pause). Repo is public,
# so Actions minutes are free/unlimited.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="https://gunji-api.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i: HTTP $code — $(cat /tmp/out.txt 2>/dev/null)"
            if [ "$code" = "200" ]; then
              echo "Backend is warm."
              exit 0
            fi
            sleep 20
          done
          # Don't fail the workflow on a transient miss (e.g. mid-deploy) — the
          # goal is keep-warm, not uptime alerting, and failures would email you.
          echo "No 200 after retries — likely a transient miss; not failing."
          exit 0
